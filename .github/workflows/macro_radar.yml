def log(*a):
    print(*a, file=sys.stderr)


def fetch_text(url, timeout=12, tries=2):
    err = None
    for i in range(tries):
        try:
            with urllib.request.urlopen(urllib.request.Request(url, headers=HEADERS), timeout=timeout) as r:
                return r.read().decode("utf-8", errors="ignore")
        except Exception as e:
            err = e
            time.sleep(1.5 * (i + 1))
    raise err


def clean(raw):
    t = html.unescape(re.sub(r"<[^>]+>", " ", raw or ""))
    t = re.sub(r"https?://\S+", " ", t)
    return re.sub(r"\s+", " ", t).strip()


def parse_rss(xml_text, label):
    out = []
    try:
        root = ET.fromstring(xml_text)
    except Exception:
        return out
    for it in root.findall(".//item"):
        title, desc = clean(it.findtext("title")), clean(it.findtext("description"))
        text = title or desc
        if desc and desc.lower() not in text.lower() and len(text) < 160:
            text = f"{text}. {desc[:260]}"
        if not text:
            continue
        pub = None
        try:
            pub = parsedate_to_datetime(it.findtext("pubDate") or "")
            pub = pub.astimezone(timezone.utc) if pub.tzinfo else pub.replace(tzinfo=timezone.utc)
        except Exception:
            pass
        guid = clean(it.findtext("guid")) or clean(it.findtext("link")) or title
        out.append(
            {
                "id": hashlib.md5(f"{label}:{guid}:{text[:80]}".encode()).hexdigest()[:12],
                "source": label,
                "text": text[:420],
                "pub": pub,
            }
        )
    return out


def tokens(t):
    return set(re.findall(r"[a-z0-9&]{3,}", t.lower()))


def near_dup(t, seen_tokens, th=0.7):
    a = tokens(t)
    return any(len(a & b) / max(1, len(a | b)) >= th for b in seen_tokens)


def get_quote(label, ticker):
    url = f"https://query1.finance.yahoo.com/v8/finance/chart/{urllib.parse.quote(ticker)}?range=1d&interval=15m"
    m = json.loads(fetch_text(url, 15))["chart"]["result"][0]["meta"]
    cur, prev = m.get("regularMarketPrice"), m.get("chartPreviousClose") or m.get("previousClose")
    if cur is None:
        return None
    cur, prev = float(cur), (float(prev) if prev else None)
    if label == "US10Y" and cur > 20:  # ^TNX баъзан ×10 мешавад
        cur, prev = cur / 10, (prev / 10 if prev else None)
    return {"price": round(cur, 3), "prev_close": round(prev, 3) if prev else None}


def classify(text):
    return [n for n, rx in TOPIC_RX if rx.search(text)]


def asset_view(asset, day):
    contribs, score = [], 0.0
    for f, coef in FACTORS[asset].items():
        chg = day.get(f)
        if chg is None:
            continue
        c = coef * max(-1.0, min(1.0, chg / SCALE[f]))
        score += c
        if abs(c) >= 0.1:
            contribs.append((abs(c), f"{NAME_TJ[f]} {chg:+.2f}% → {'дастгирӣ барои' if c > 0 else 'фишор ба'} {asset}"))
    contribs.sort(reverse=True)
    mag = abs(score)
    if mag < 0.25:
        bias, strength = "бетараф ➡️", ""
    else:
        bias = "боло ⬆️" if score > 0 else "поин ⬇️"
        strength = " (заиф)" if mag < 0.5 else " (миёна)" if mag < 0.8 else " (қавӣ)"
    own = day.get(asset)
    lines = [f"▪ {asset}" + (f": имрӯз {own:+.2f}%" if own is not None else "")]
    lines += [f"  – {c[1]}" for c in contribs[:3]] or ["  – омили macro-и возеҳ нест"]
    lines.append(f"  Самти эҳтимолии наздик: {bias}{strength}")
    return "\n".join(lines)


def to_chunks(body, limit=NTFY_LIMIT):
    chunks, cur = [], ""
    for sec in body.split("\n\n"):
        cand = f"{cur}\n\n{sec}" if cur else sec
        if len(cand.encode()) <= limit:
            cur = cand
            continue
        if cur:
            chunks.append(cur)
        while len(sec.encode()) > limit:
            sec = sec.encode()[:limit].decode("utf-8", "ignore")
        cur = sec
    if cur:
        chunks.append(cur)
    return chunks


def send_ntfy(topic, title, body, priority):
    chunks = to_chunks(body)
    for i, ch in enumerate(chunks, 1):
        t = title + (f" ({i}/{len(chunks)})" if len(chunks) > 1 else "")
        if DRY_RUN or not topic:
            print(f"--- [{t}] ---\n{ch}\n")
            continue
        req = urllib.request.Request(
            f"https://ntfy.sh/{topic}",
            data=ch.encode("utf-8"),
            method="POST",
            headers={"Title": t, "Priority": priority, "Tags": "chart_with_upwards_trend"},
        )
        try:
            with urllib.request.urlopen(req, timeout=15) as r:
                log("ntfy", r.status)
        except Exception as e:
            log("ntfy error:", e)


def main():
    os.makedirs("state", exist_ok=True)
    first_run = not os.path.exists(STATE_FILE)
    prev = {}
    if not first_run:
        try:
            prev = json.load(open(STATE_FILE, encoding="utf-8"))
        except Exception:
            first_run, prev = True, {}
    now = datetime.now(timezone.utc)
    prev_prices, seen = prev.get("prices", {}), dict(prev.get("seen", {}))
    seen = {k: v for k, v in seen.items() if now.timestamp() - v < 86400 * 2}
    missing = []

    # 1) Нархҳо
    quotes, day, since_last, moves = {}, {}, {}, []
    for label, tk in ALL.items():
        try:
            q = get_quote(label, tk)
            if not q:
                raise ValueError("no price")
            quotes[label] = q
            if q["prev_close"]:
                day[label] = (q["price"] - q["prev_close"]) / abs(q["prev_close"]) * 100
            p = prev_prices.get(label)
            if isinstance(p, (int, float)) and p:
                since_last[label] = (q["price"] - p) / abs(p) * 100
                if abs(since_last[label]) >= THRESH[label]:
                    moves.append(f"{label} {since_last[label]:+.2f}%")
        except Exception as e:
            missing.append(f"нарх:{label}")
            log("quote fail", label, e)

    # 2) Хабарҳо (X + RSS ҳамеша ҳарду)
    collected, x_ok = [], []
    for h in X_HANDLES:
        for b in X_BASES:
            try:
                items = parse_rss(fetch_text(f"{b}/{h}/rss", 10, tries=1), f"@{h}")
                if items:
                    collected += items[:5]
                    x_ok.append(h)
                    break
            except Exception:
                continue
    if not x_ok:
        missing.append("X (nitter)")
    for name, url in RSS:
        try:
            collected += parse_rss(fetch_text(url, 12), name)[:8]
        except Exception:
            missing.append(name)

    cutoff = now - timedelta(hours=MAX_NEWS_AGE_H)
    collected.sort(key=lambda e: e["pub"] or now, reverse=True)
    fresh, seen_tok = [], []
    for e in collected:
        if e["id"] in seen or (e["pub"] and e["pub"] < cutoff):
            continue
        tp = classify(e["text"])
        if not tp and not e["source"].startswith("@"):
            continue
        if near_dup(e["text"], seen_tok):
            seen[e["id"]] = now.timestamp()
            continue
        seen_tok.append(tokens(e["text"]))
        e["topics"] = tp
        fresh.append(e)
        seen[e["id"]] = now.timestamp()
        if len(fresh) >= MAX_NEWS_SHOWN:
            break

    notify = first_run or bool(moves) or bool(fresh)
    if notify:
        # 3) Тарҷума
        tr = Translator(os.environ.get("GEMINI_API_KEY") or None, log=log)
        tj = tr.translate_many([e["text"] for e in fresh]) if fresh else []

        topics = []
        for e in fresh:
            for t in e["topics"]:
                if t not in topics:
                    topics.append(t)

        head = [f"Вақт: {now:%Y-%m-%d %H:%M} UTC"]
        head.append(
            "Ҳушдори ҳаракат: " + ", ".join(moves)
            if moves
            else ("Ҳолати аввалия" if first_run else "Навсозии макро ва катализаторҳо")
        )
        price_lines = ["Нархҳо:"]
        for label in ALL:
            q = quotes.get(label)
            if not q:
                price_lines.append(f"• {label}: дастрас нест")
                continue
            d, s = day.get(label), since_last.get(label)
            price_lines.append(
                f"• {label}: {q['price']}"
                + (f" | рӯз {d:+.2f}%" if d is not None else "")
                + (f" | аз санҷиши охир {s:+.2f}%" if s is not None else "")
            )
        sections = ["\n".join(head), "\n".join(price_lines)]

        if topics:
            sections.append("Нарративи асосии ҳозира: " + " + ".join(topics[:3]))
        sections.append(
            "Хулосаи эҳтимолӣ барои ҳар актив (ин сигнали савдо нест):\n\n"
            + "\n\n".join(asset_view(a, day) for a in CORE)
        )
        if fresh:
            nl = ["Хабарҳои катализаторӣ (тарҷумаи тоҷикӣ):"]
            for e, t in zip(fresh, tj):
                ts = f" · {e['pub']:%H:%M}" if e["pub"] else ""
                nl.append(f"• [{e['source']}{ts}] {t}")
            sections.append("\n".join(nl))
        foot = [f"Тарҷума: {tr.label()}" if fresh else ""]
        if missing:
            foot.append("⚠ Манбаъи ғоиб: " + ", ".join(missing))
        if any(foot):
            sections.append("\n".join(x for x in foot if x))
        send_ntfy(
            os.environ.get("NTFY_TOPIC"),
            "Macro Catalyst Engine",
            "\n\n".join(sections),
            "high" if moves else "default",
        )
    else:
        print("No significant move or new catalyst; skipping alert.")

    seen = dict(sorted(seen.items(), key=lambda kv: kv[1])[-300:])
    json.dump(
        {
            "last_run_utc": now.isoformat(),
            "prices": {k: v["price"] for k, v in quotes.items()},
            "last_alert_moves": moves,
            "active_x_feeds": sorted(x_ok),
            "seen": seen,
        },
        open(STATE_FILE, "w", encoding="utf-8"),
        indent=2,
        ensure_ascii=False,
    )


if __name__ == "__main__":
    main()
