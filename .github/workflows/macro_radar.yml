name: Macro Catalyst Radar

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

jobs:
  run-radar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run market radar and update state
        env:
          NTFY_TOPIC: macro_radar_muhammad_7721
        run: |
          python - << 'EOF'
          import json
          import os
          import urllib.parse
          import urllib.request
          from datetime import datetime, timezone

          os.makedirs("state", exist_ok=True)
          state_file = "state/last_state.json"

          core_symbols = {
              "XAUUSD": "GC=F",
              "NAS100": "NQ=F",
              "SPX500": "^GSPC",
          }

          macro_symbols = {
              "DXY": "DX-Y.NYB",
              "US10Y": "^TNX",
              "VIX": "^VIX",
          }

          all_symbols = {**core_symbols, **macro_symbols}
          thresholds = {
              "XAUUSD": 0.25,
              "NAS100": 0.30,
              "SPX500": 0.25,
              "DXY": 0.20,
              "US10Y": 1.00,
              "VIX": 3.00,
          }

          headers = {"User-Agent": "Mozilla/5.0"}
          current_prices = {}

          for label, ticker in all_symbols.items():
              url = f"https://query1.finance.yahoo.com/v8/finance/chart/{urllib.parse.quote(ticker)}?range=1d&interval=15m"
              try:
                  req = urllib.request.Request(url, headers=headers)
                  with urllib.request.urlopen(req, timeout=15) as resp:
                      data = json.loads(resp.read().decode("utf-8"))
                      meta = data["chart"]["result"][0]["meta"]
                      price = meta.get("regularMarketPrice")
                      if price is not None:
                          current_prices[label] = round(float(price), 2)
                      else:
                          current_prices[label] = None
              except Exception:
                  current_prices[label] = None

          prev_state = {}
          if os.path.exists(state_file):
              try:
                  with open(state_file, "r", encoding="utf-8") as f:
                      prev_state = json.load(f)
              except Exception:
                  prev_state = {}

          prev_prices = prev_state.get("prices", {})
          significant_moves = []
          formatted_lines = []

          for label in all_symbols:
              cur = current_prices.get(label)
              prev = prev_prices.get(label)
              if cur is None:
                  formatted_lines.append(f"{label}: N/A")
                  continue

              if isinstance(prev, (int, float)) and prev != 0:
                  pct_change = ((cur - prev) / abs(prev)) * 100.0
                  arrow = "↑" if pct_change > 0 else ("↓" if pct_change < 0 else "•")
                  formatted_lines.append(f"{label}: {cur} ({arrow} {pct_change:+.2f}%)")
                  if abs(pct_change) >= thresholds.get(label, 0.25):
                      significant_moves.append(f"{label} {pct_change:+.2f}%")
              else:
                  formatted_lines.append(f"{label}: {cur}")

          is_first_run = not os.path.exists(state_file)
          should_notify = is_first_run or (len(significant_moves) > 0)
          now_str = datetime.now(timezone.utc).strftime("%Y-%m-%d %H:%M UTC")

          if should_notify:
              topic = os.environ.get("NTFY_TOPIC", "macro_radar_muhammad_7721")
              header_tag = "Initial Snapshot" if is_first_run else "Move Alert: " + ", ".join(significant_moves)
              body = f"{header_tag}\nTime: {now_str}\n" + "\n".join(formatted_lines)
              ntfy_req = urllib.request.Request(
                  f"https://ntfy.sh/{topic}",
                  data=body.encode("utf-8"),
                  headers={
                      "Title": "Macro Catalyst Engine",
                      "Priority": "default",
                      "Tags": "chart_with_upwards_trend,globe_with_meridians",
                  },
                  method="POST",
              )
              try:
                  with urllib.request.urlopen(ntfy_req, timeout=15) as r:
                      print("ntfy status:", r.status)
              except Exception as e:
                  print("ntfy error:", e)
          else:
              print("No significant move above threshold; skipping alert.")

          new_state = {
              "last_run_utc": now_str,
              "prices": current_prices,
              "last_alert_moves": significant_moves,
          }
          with open(state_file, "w", encoding="utf-8") as f:
              json.dump(new_state, f, indent=2, ensure_ascii=False)
          EOF

      - name: Commit updated state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/
          if ! git diff --staged --quiet; then
            git commit -m "Update state [skip ci]"
            git push
          else
            echo "No state changes to commit."
          fi
