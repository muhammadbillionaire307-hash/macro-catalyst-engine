views = {a: asset_view(a, day) for a in CORE}
                  gem = None
                  if fresh and gem_key and quota["n"] < GEM_DAILY_CAP:
                      quota["n"] += 1
                      try:
                          facts = {"рӯзона_%": {k: round(v, 2) for k, v in day.items()},
                                   "хабарҳо": [e["text"][:300] for e in fresh],
                                   "хулосаи_риёзӣ": {a: views[a][2].strip() for a in CORE}}
                          gem = gemini_analysis(facts, gem_key)
                      except Exception as ex:
                          log("gemini analysis failed:", ex)
                  blocks = []
                  for a in CORE:
                      h, b, bias = views[a]
                      blocks.append("\n".join([h] + ([gem[a]] if gem else b) + [bias]))
                  sections.append("Хулосаи эҳтимолӣ (ин сигнали савдо нест) — " +
                                  ("таҳлил: Gemini" if gem else "таҳлил: ⚠ Fallback (риёзӣ, на Gemini)") + "\n\n" + "\n\n".join(blocks))
                  if fresh:
                      nl = ["Хабарҳои катализаторӣ (тарҷумаи тоҷикӣ):"]
                      for e, t in zip(fresh, tj):
                          ts = f" · {e['pub']:%H:%M}" if e["pub"] else ""
                          nl.append(f"• [{e['source']}{ts}] {t}")
                      sections.append("\n".join(nl))
                  foot = ([f"Тарҷума: {tr_label}"] if fresh else []) + (["⚠ Манбаъи ғоиб: " + ", ".join(missing)] if missing else [])
                  if foot:
                      sections.append("\n".join(foot))
                  send_ntfy(os.environ.get("NTFY_TOPIC"), "Macro Catalyst Engine", "\n\n".join(sections),
                            "high" if moves else "default")
              else:
                  print("No significant move or new catalyst; skipping alert.")

              seen = dict(sorted(seen.items(), key=lambda kv: kv[1])[-300:])
              json.dump({"last_run_utc": now.isoformat(), "prices": {k: v["price"] for k, v in quotes.items()},
                         "last_alert_moves": moves, "active_x_feeds": sorted(x_ok), "seen": seen,
                         "hist": hist, "quota": quota},
                        open(STATE_FILE, "w", encoding="utf-8"), indent=2, ensure_ascii=False)


          def main():
              """Ҳеҷ гоҳ workflow-ро сурх намекунад: хаторо сабт мекунад ва (ҳадди аксар 1 бор дар 3 соат) ба ntfy мефиристад."""
              try:
                  run()
              except Exception as e:
                  traceback.print_exc()
                  try:
                      os.makedirs("state", exist_ok=True)
                      mark = "state/last_error.txt"
                      last = float(open(mark).read()) if os.path.exists(mark) else 0
                      if time.time() - last > 3 * 3600:
                          send_ntfy(os.environ.get("NTFY_TOPIC"), "Macro Radar ERROR",
                                    f"⚠ Радар хато дод: {type(e).name}: {str(e)[:200]}", "default")
                          open(mark, "w").write(str(time.time()))
                  except Exception:
                      pass


          if name == "main":
              main()
          EOF

      - name: Commit updated state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/ || true
          if git diff --staged --quiet; then
            echo "No state changes to commit."
            exit 0
          fi
          git commit -m "Update state [skip ci]"
          for i in 1 2 3; do
            if git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && git push; then
              exit 0
            fi
            git rebase --abort || true
            sleep $((i * 3))
          done
          echo "push failed (non-fatal)"
          exit 0
