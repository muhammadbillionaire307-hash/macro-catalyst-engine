name: Macro Catalyst Radar

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

jobs:
  run-radar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run market and narrative radar
        env:
          NTFY_TOPIC: macro_radar_muhammad_7721
        run: |
          python - << 'EOF'
          import hashlib
          import html
          import json
          import os
          import re
          import urllib.parse
          import urllib.request
          import xml.etree.ElementTree as ET
          from datetime import datetime, timezone

          os.makedirs("state", exist_ok=True)
          state_file = "state/last_state.json"

          core_symbols = {
              "XAUUSD": "GC=F",
              "NAS100": "NQ=F",
              "SPX500": "^GSPC",
          }

          macro_symbols = {
              "DXY": "DX-Y.NYB",
              "US10Y": "^TNX",
              "VIX": "^VIX",
          }

          all_symbols = {**core_symbols, **macro_symbols}
          thresholds = {
              "XAUUSD": 0.25,
              "NAS100": 0.30,
              "SPX500": 0.25,
              "DXY": 0.20,
              "US10Y": 1.00,
              "VIX": 3.00,
          }

          x_handles = [
              "FirstSquawk",
              "DeItaone",
              "Investingcom",
              "OilHeadlineNews",
              "financialjuice",
              "FaytuksNetwork",
          ]

          x_rss_bases = [
              "https://nitter.net",
              "https://xcancel.com",
          ]

          fallback_rss_feeds = [
              ("Investing Macro", "https://www.investing.com/rss/news_25.rss"),
              ("Investing Commodities", "https://www.investing.com/rss/news_11.rss"),
              ("Yahoo Finance", "https://feeds.finance.yahoo.com/rss/2.0/headline?s=GC=F,NQ=F,^GSPC,DX-Y.NYB&region=US&lang=en-US"),
          ]

          topic_rules = [
              ("Сиёсати ФРС ва фоизҳо", ["fed", "powell", "fomc", "rate", "rates", "central bank", "ecb", "boe", "boj"]),
              ("Таваррум ва бозори меҳнат", ["cpi", "pce", "nfp", "jobs", "unemployment", "inflation", "gdp", "recession"]),
              ("Тарифҳо ва тиҷорати ҷаҳонӣ", ["tariff", "tariffs", "trump", "trade", "china", "mexico", "import", "export"]),
              ("Геосиёсат ва амният", ["war", "iran", "israel", "russia", "ukraine", "geopolitical", "military", "leader", "eu", "budget"]),
              ("Доллар ва вомбаргҳо", ["treasury", "yield", "yields", "dollar", "dxy", "liquidity"]),
              ("Тилло, нафт ва индексҳо", ["gold", "xau", "nasdaq", "s&p", "sp500", "oil", "crude", "opec", "stocks", "equities"]),
          ]

          phrase_patterns = [
              (r"\b(.+?)\s+end(?:s)?\s+higher\s+as\s+(.+)", r"\1 дар поёни савдо бо сабаби \2 боло рафт"),
              (r"\b(.+?)\s+end(?:s)?\s+lower\s+as\s+(.+)", r"\1 дар поёни савдо бо сабаби \2 поин рафт"),
              (r"\b(.+?)\s+higher\s+at\s+close\s+of\s+trade\b", r"\1 ҳангоми басташавии савдо боло рафт"),
              (r"\b(.+?)\s+lower\s+at\s+close\s+of\s+trade\b", r"\1 ҳангоми басташавии савдо поин рафт"),
              (r"\b(.+?)\s+urges?\s+(.+?)\s+to\s+crack\s+down\s+on\s+(.+)", r"\1 аз \2 даъват кард, ки бар зидди \3 чораҳои қатъӣ бинад"),
              (r"\b(.+?)\s+urges?\s+(.+?)\s+to\s+(.+)", r"\1 аз \2 даъват кард, ки \3"),
              (r"\bwrestle\s+over\s+(.+?),\s*(.+?),\s*as\s+(.+?)\s+focuses\s+minds\b", r"баҳсҳо бар сари \1 ва \2 дар ҳоле идома доранд, ки \3 таваҷҷуҳро ба худ ҷалб кардааст"),
              (r"\bwrestle\s+over\s+(.+)", r"баҳсҳои шадид бар сари \1 идома доранд"),
              (r"\bthanksgiving\s+lull\s+offer(?:s)?\s+relief\b", r"оромии муваққатии рӯзи Шукргузорӣ сабукӣ овард"),
              (r"\bbenign\s+u\.?s\.?\s+tariffs?\b", r"тарифҳои нисбатан сабуки ИМА"),
              (r"\btariff\s+dodging\b", r"саркашӣ аз пардохти тарифҳо"),
              (r"\bguards-linked\s+basij\s+volunteers\b", r"ихтиёриёни Басиҷи вобаста ба Сипоҳ"),
              (r"\bbroaden\s+social\s+reach\b", r"доираи фаъолияти иҷтимоиро васеътар кунанд"),
              (r"\bsupreme\s+leader\b", r"раҳбари олӣ"),
          ]

          word_map = [
              (r"\bunited\s+kingdom\s+100\b|\bftse\s*100\b", "индекси FTSE 100-и Бритониё"),
              (r"\bu\.?k\.?\b|\bbritain\b|\bbritish\b", "Бритониё"),
              (r"\bu\.?s\.?\b|\bunited\s+states\b|\bamerica\b|\bamerican\b", "ИМА"),
              (r"\beuropean\s+stocks\b", "саҳмияҳои аврупоӣ"),
              (r"\beuropean\b|\beu\b", "Аврупо"),
              (r"\bmexico\b", "Мексика"),
              (r"\basian\s+trade\s+partners\b", "шарикони тиҷоратии осиёӣ"),
              (r"\bash?ia\b|\basian\b", "Осиё"),
              (r"\bchina\b|\bchinese\b", "Чин"),
              (r"\biran\b|\biranian\b", "Эрон"),
              (r"\bisrael\b|\bisraeli\b", "Исроил"),
              (r"\brussia\b|\brussian\b", "Русия"),
              (r"\bukraine\b|\bukrainian\b", "Украина"),
              (r"\btrump\b", "Трамп"),
              (r"\bpowell\b", "Пауэлл"),
              (r"\bfed\b|\bfomc\b", "ФРС"),
              (r"\ble\s+pen\b", "Ле Пен"),
              (r"\btariffs?\b", "тарифҳо"),
              (r"\bbudget\b", "буҷет"),
              (r"\bfinancing\b", "маблағгузорӣ"),
              (r"\bleaders?\b", "роҳбарон"),
              (r"\bcentral\s+bank\b", "бонки марказӣ"),
              (r"\binterest\s+rates?\b|\brates?\b", "фоизҳои баҳра"),
              (r"\binflation\b", "таваррум"),
              (r"\bcpi\b", "ИХИ (CPI)"),
              (r"\bpce\b", "PCE"),
              (r"\bnfp\b|\bnonfarm\s+payrolls?\b", "омори шуғл (NFP)"),
              (r"\bunemployment\b", "бекорӣ"),
              (r"\bjobs?\b", "ҷойҳои корӣ"),
              (r"\bgdp\b", "ММД (GDP)"),
              (r"\brecession\b", "рукӯди иқтисодӣ"),
              (r"\btreasury\b|\btreasuries\b", "вомбаргҳои хазинадорӣ"),
              (r"\byields?\b", "даромаднокӣ"),
              (r"\bdollar\b|\bdxy\b", "доллар"),
              (r"\bgold\b|\bxau\b", "тилло"),
              (r"\bnasdaq\b|\bnas100\b", "Nasdaq"),
              (r"\bs&p\s*500\b|\bs&p\b|\bspx500\b", "S&P 500"),
              (r"\bstocks?\b|\bequities?\b", "саҳмияҳо"),
              (r"\boil\b|\bcrude\b", "нафт"),
              (r"\bopec\b", "ОПЕК"),
              (r"\bwar\b", "ҷанг"),
              (r"\bgeopolitical\b", "геосиёсӣ"),
              (r"\btrade\b", "тиҷорат"),
              (r"\bmarket(?:s)?\b", "бозор"),
              (r"\bhigher\b", "болотар"),
              (r"\blower\b", "поинтар"),
              (r"\brise(?:s|d|ing)?\b|\bgain(?:s|ed|ing)?\b", "афзоиш ёфт"),
              (r"\bfall(?:s|ed|ing)?\b|\bdrop(?:s|ped|ping)?\b|\bdecline(?:s|d|ing)?\b", "коҳиш ёфт"),
              (r"\bcut(?:s|ting)?\b", "коҳиш дод"),
              (r"\bhike(?:s|d|ing)?\b|\braise(?:s|d|ing)?\b", "боло бурд"),
              (r"\band\b", "ва"),
              (r"\bof\b", "аз"),
              (r"\bin\b", "дар"),
              (r"\bon\b", "бар"),
              (r"\bto\b", "ба"),
              (r"\bfor\b", "барои"),
              (r"\bwith\b", "бо"),
              (r"\bfrom\b", "аз"),
          ]

          all_keywords = [kw for _, kws in topic_rules for kw in kws]

          headers = {
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36"
          }

          def fetch_text(url, timeout=12):
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req, timeout=timeout) as resp:
                  return resp.read().decode("utf-8", errors="ignore")

          def clean_text(raw):
              txt = re.sub(r"<[^>]+>", " ", raw or "")
              txt = html.unescape(txt)
              txt = re.sub(r"\s+", " ", txt).strip()
              return txt

          def parse_rss_items(xml_text, source_label):
              items = []
              if not xml_text or "<" not in xml_text:
                  return items
              try:
                  root = ET.fromstring(xml_text)
              except Exception:
                  return items

              for item in root.findall(".//item"):
                  title = clean_text(item.findtext("title"))
                  desc = clean_text(item.findtext("description"))
                  guid = clean_text(item.findtext("guid")) or clean_text(item.findtext("link")) or title
                  text_body = title if title else desc
                  if desc and desc.lower() not in text_body.lower():
                      text_body = f"{text_body} — {desc[:140]}"
                  if not text_body:
                      continue
                  uid = hashlib.md5(f"{source_label}:{guid}:{text_body[:100]}".encode("utf-8")).hexdigest()[:12]
                  items.append({
                      "id": uid,
                      "source": source_label,
                      "text": text_body[:240],
                  })
              return items

          def classify_topic(text_low):
              for tj_topic, kws in topic_rules:
                  if any(k in text_low for k in kws):
                      return tj_topic
              return "Контексти умумии бозор"

          def translate_to_tajik(raw_text):
              txt = re.sub(r"\s*[-—|]\s*Investing\.com.*$", "", raw_text, flags=re.I).strip()
              low = txt.lower()

              for pat, repl in phrase_patterns:
                  if re.search(pat, low):
                      txt = re.sub(pat, repl, txt, flags=re.I)
                      break

              for pat, tj_repl in word_map:
                  txt = re.sub(pat, tj_repl, txt, flags=re.I)

              txt = re.sub(r"\s+,", ",", txt)
              txt = re.sub(r",\s*,+", ", ", txt)
              txt = re.sub(r"\s+", " ", txt).strip(" ,;-")
              if txt:
                  txt = txt[0].upper() + txt[1:]
              return txt[:220]

          current_prices = {}
          for label, ticker in all_symbols.items():
              url = f"https://query1.finance.yahoo.com/v8/finance/chart/{urllib.parse.quote(ticker)}?range=1d&interval=15m"
              try:
                  data = json.loads(fetch_text(url, timeout=15))
                  meta = data["chart"]["result"][0]["meta"]
                  price = meta.get("regularMarketPrice")
                  current_prices[label] = round(float(price), 2) if price is not None else None
              except Exception:
                  current_prices[label] = None

          prev_state = {}
          if os.path.exists(state_file):
              try:
                  with open(state_file, "r", encoding="utf-8") as f:
                      prev_state = json.load(f)
              except Exception:
                  prev_state = {}

          prev_prices = prev_state.get("prices", {})
          seen_ids = list(prev_state.get("seen_news", []))
          seen_set = set(seen_ids)

          significant_moves = []
          formatted_lines = []

          for label in all_symbols:
              cur = current_prices.get(label)
              prev = prev_prices.get(label)
              if cur is None:
                  formatted_lines.append(f"{label}: дастрас нест")
                  continue

              if isinstance(prev, (int, float)) and prev != 0:
                  pct_change = ((cur - prev) / abs(prev)) * 100.0
                  arrow = "↑" if pct_change > 0 else ("↓" if pct_change < 0 else "•")
                  formatted_lines.append(f"{label}: {cur} ({arrow} {pct_change:+.2f}%)")
                  if abs(pct_change) >= thresholds.get(label, 0.25):
                      significant_moves.append(f"{label} {pct_change:+.2f}%")
              else:
                  formatted_lines.append(f"{label}: {cur}")

          collected_news = []
          active_x_sources = []

          for handle in x_handles:
              for base in x_rss_bases:
                  feed_url = f"{base}/{handle}/rss"
                  try:
                      xml_data = fetch_text(feed_url, timeout=10)
                      parsed = parse_rss_items(xml_data, f"@{handle}")
                      if parsed:
                          collected_news.extend(parsed[:5])
                          active_x_sources.append(f"@{handle}")
                          break
                  except Exception:
                      continue

          if not collected_news:
              for src_name, feed_url in fallback_rss_feeds:
                  try:
                      xml_data = fetch_text(feed_url, timeout=12)
                      parsed = parse_rss_items(xml_data, src_name)
                      if parsed:
                          collected_news.extend(parsed[:6])
                  except Exception:
                      continue

          fresh_relevant_news = []
          detected_topics = []
          for entry in collected_news:
              if entry["id"] in seen_set:
                  continue
              low = entry["text"].lower()
              if any(k in low for k in all_keywords) or entry["source"].startswith("@"):
                  t_name = classify_topic(low)
                  if t_name not in detected_topics:
                      detected_topics.append(t_name)
                  fresh_relevant_news.append({
                      "source": entry["source"],
                      "tj_text": translate_to_tajik(entry["text"]),
                  })
                  seen_ids.append(entry["id"])
                  seen_set.add(entry["id"])
                  if len(fresh_relevant_news) >= 4:
                      break

          seen_ids = seen_ids[-60:]

          is_first_run = not os.path.exists(state_file)
          has_move = len(significant_moves) > 0
          has_news = len(fresh_relevant_news) > 0
          should_notify = is_first_run or has_move or has_news

          now_str = datetime.now(timezone.utc).strftime("%Y-%m-%d %H:%M UTC")

          if should_notify:
              topic = os.environ.get("NTFY_TOPIC", "macro_radar_muhammad_7721")
              parts = []
              if is_first_run:
                  parts.append("Ҳолати аввалия + Тарҷумаи тоҷикӣ")
              elif has_move:
                  parts.append("Ҳушдори ҳаракат: " + ", ".join(significant_moves))
              else:
                  parts.append("Навсозии макро ва катализаторҳо")

              parts.append(f"Вақт: {now_str}")
              parts.extend(formatted_lines)

              if detected_topics:
                  parts.append("\nНарративи асосии ҳозира: " + " + ".join(detected_topics[:3]))
                  parts.append("Таъсир ба XAUUSD / NAS100 / SPX500: доллар, фоизҳо ва хатарро бо назардошти ҳаракати нарх таҳлил кунед.")

              if fresh_relevant_news:
                  parts.append("\nХабарҳои катализаторӣ (бо тарҷумаи тоҷикӣ):")
                  for n in fresh_relevant_news:
                      parts.append(f"• [{n['source']}] {n['tj_text']}")

              body = "\n".join(parts)[:3800]
              ntfy_req = urllib.request.Request(
                  f"https://ntfy.sh/{topic}",
                  data=body.encode("utf-8"),
                  headers={
                      "Title": "Macro Catalyst Engine",
                      "Priority": "high" if has_move else "default",
                      "Tags": "chart_with_upwards_trend,newspaper",
                  },
                  method="POST",
              )
              try:
                  with urllib.request.urlopen(ntfy_req, timeout=15) as r:
                      print("ntfy status:", r.status)
              except Exception as e:
                  print("ntfy error:", e)
          else:
              print("No significant move or new catalyst; skipping alert.")

          new_state = {
              "last_run_utc": now_str,
              "prices": current_prices,
              "last_alert_moves": significant_moves,
              "active_x_feeds": sorted(set(active_x_sources)),
              "seen_news": seen_ids,
          }
          with open(state_file, "w", encoding="utf-8") as f:
              json.dump(new_state, f, indent=2, ensure_ascii=False)
          EOF

      - name: Commit updated state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/
          if ! git diff --staged --quiet; then
            git commit -m "Update state [skip ci]"
            git push
          else
            echo "No state changes to commit."
          fi
