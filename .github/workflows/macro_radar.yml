name: Macro Catalyst Radar

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

jobs:
  run-radar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run market and narrative radar
        env:
          NTFY_TOPIC: macro_radar_muhammad_7721
        run: |
          python - << 'EOF'
          import hashlib
          import html
          import json
          import os
          import re
          import urllib.parse
          import urllib.request
          import xml.etree.ElementTree as ET
          from datetime import datetime, timezone

          os.makedirs("state", exist_ok=True)
          state_file = "state/last_state.json"

          core_symbols = {
              "XAUUSD": "GC=F",
              "NAS100": "NQ=F",
              "SPX500": "^GSPC",
          }

          macro_symbols = {
              "DXY": "DX-Y.NYB",
              "US10Y": "^TNX",
              "VIX": "^VIX",
          }

          all_symbols = {**core_symbols, **macro_symbols}
          thresholds = {
              "XAUUSD": 0.25,
              "NAS100": 0.30,
              "SPX500": 0.25,
              "DXY": 0.20,
              "US10Y": 1.00,
              "VIX": 3.00,
          }

          x_handles = [
              "FirstSquawk",
              "DeItaone",
              "Investingcom",
              "OilHeadlineNews",
              "financialjuice",
              "FaytuksNetwork",
          ]

          x_rss_bases = [
              "https://nitter.net",
              "https://xcancel.com",
          ]

          fallback_rss_feeds = [
              ("Investing Macro", "https://www.investing.com/rss/news_25.rss"),
              ("Investing Commodities", "https://www.investing.com/rss/news_11.rss"),
              ("Yahoo Finance", "https://feeds.finance.yahoo.com/rss/2.0/headline?s=GC=F,NQ=F,^GSPC,DX-Y.NYB&region=US&lang=en-US"),
          ]

          keywords = [
              "fed", "powell", "fomc", "rate", "rates", "cpi", "pce", "nfp",
              "jobs", "unemployment", "inflation", "gdp", "treasury", "yield",
              "yields", "dollar", "dxy", "gold", "xau", "nasdaq", "s&p", "sp500",
              "oil", "crude", "opec", "tariff", "tariffs", "trump", "china",
              "war", "iran", "israel", "russia", "ukraine", "geopolitical",
              "central bank", "ecb", "boe", "boj", "recession", "liquidity"
          ]

          headers = {
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36"
          }

          def fetch_text(url, timeout=12):
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req, timeout=timeout) as resp:
                  return resp.read().decode("utf-8", errors="ignore")

          def clean_text(raw):
              txt = re.sub(r"<[^>]+>", " ", raw or "")
              txt = html.unescape(txt)
              txt = re.sub(r"\s+", " ", txt).strip()
              return txt

          def parse_rss_items(xml_text, source_label):
              items = []
              if not xml_text or "<" not in xml_text:
                  return items
              try:
                  root = ET.fromstring(xml_text)
              except Exception:
                  return items

              for item in root.findall(".//item"):
                  title = clean_text(item.findtext("title"))
                  desc = clean_text(item.findtext("description"))
                  guid = clean_text(item.findtext("guid")) or clean_text(item.findtext("link")) or title
                  text_body = title if title else desc
                  if desc and desc.lower() not in text_body.lower():
                      text_body = f"{text_body} — {desc[:140]}"
                  if not text_body:
                      continue
                  uid = hashlib.md5(f"{source_label}:{guid}:{text_body[:100]}".encode("utf-8")).hexdigest()[:12]
                  items.append({
                      "id": uid,
                      "source": source_label,
                      "text": text_body[:240],
                  })
              return items

          current_prices = {}
          for label, ticker in all_symbols.items():
              url = f"https://query1.finance.yahoo.com/v8/finance/chart/{urllib.parse.quote(ticker)}?range=1d&interval=15m"
              try:
                  data = json.loads(fetch_text(url, timeout=15))
                  meta = data["chart"]["result"][0]["meta"]
                  price = meta.get("regularMarketPrice")
                  current_prices[label] = round(float(price), 2) if price is not None else None
              except Exception:
                  current_prices[label] = None

          prev_state = {}
          if os.path.exists(state_file):
              try:
                  with open(state_file, "r", encoding="utf-8") as f:
                      prev_state = json.load(f)
              except Exception:
                  prev_state = {}

          prev_prices = prev_state.get("prices", {})
          seen_ids = list(prev_state.get("seen_news", []))
          seen_set = set(seen_ids)

          significant_moves = []
          formatted_lines = []

          for label in all_symbols:
              cur = current_prices.get(label)
              prev = prev_prices.get(label)
              if cur is None:
                  formatted_lines.append(f"{label}: N/A")
                  continue

              if isinstance(prev, (int, float)) and prev != 0:
                  pct_change = ((cur - prev) / abs(prev)) * 100.0
                  arrow = "↑" if pct_change > 0 else ("↓" if pct_change < 0 else "•")
                  formatted_lines.append(f"{label}: {cur} ({arrow} {pct_change:+.2f}%)")
                  if abs(pct_change) >= thresholds.get(label, 0.25):
                      significant_moves.append(f"{label} {pct_change:+.2f}%")
              else:
                  formatted_lines.append(f"{label}: {cur}")

          collected_news = []
          active_x_sources = []

          for handle in x_handles:
              got_handle = False
              for base in x_rss_bases:
                  feed_url = f"{base}/{handle}/rss"
                  try:
                      xml_data = fetch_text(feed_url, timeout=10)
                      parsed = parse_rss_items(xml_data, f"@{handle}")
                      if parsed:
                          collected_news.extend(parsed[:5])
                          active_x_sources.append(f"@{handle}")
                          got_handle = True
                          break
                  except Exception:
                      continue
              if not got_handle:
                  pass

          if not collected_news:
              for src_name, feed_url in fallback_rss_feeds:
                  try:
                      xml_data = fetch_text(feed_url, timeout=12)
                      parsed = parse_rss_items(xml_data, src_name)
                      if parsed:
                          collected_news.extend(parsed[:6])
                  except Exception:
                      continue

          fresh_relevant_news = []
          for entry in collected_news:
              if entry["id"] in seen_set:
                  continue
              low = entry["text"].lower()
              if any(k in low for k in keywords) or entry["source"].startswith("@"):
                  fresh_relevant_news.append(entry)
                  seen_ids.append(entry["id"])
                  seen_set.add(entry["id"])
                  if len(fresh_relevant_news) >= 4:
                      break

          seen_ids = seen_ids[-60:]

          is_first_run = not os.path.exists(state_file)
          has_move = len(significant_moves) > 0
          has_news = len(fresh_relevant_news) > 0
          should_notify = is_first_run or has_move or has_news

          now_str = datetime.now(timezone.utc).strftime("%Y-%m-%d %H:%M UTC")

          if should_notify:
              topic = os.environ.get("NTFY_TOPIC", "macro_radar_muhammad_7721")
              parts = []
              if is_first_run:
                  parts.append("Initial Snapshot + Narrative Feed")
              elif has_move:
                  parts.append("Move Alert: " + ", ".join(significant_moves))
              else:
                  parts.append("Macro/X Catalyst Update")

              parts.append(f"Time: {now_str}")
              parts.extend(formatted_lines)

              if fresh_relevant_news:
                  parts.append("\nCatalysts / Headlines:")
                  for n in fresh_relevant_news:
                      parts.append(f"• [{n['source']}] {n['text']}")

              body = "\n".join(parts)[:3800]
              ntfy_req = urllib.request.Request(
                  f"https://ntfy.sh/{topic}",
                  data=body.encode("utf-8"),
                  headers={
                      "Title": "Macro Catalyst Engine",
                      "Priority": "high" if has_move else "default",
                      "Tags": "chart_with_upwards_trend,newspaper",
                  },
                  method="POST",
              )
              try:
                  with urllib.request.urlopen(ntfy_req, timeout=15) as r:
                      print("ntfy status:", r.status)
              except Exception as e:
                  print("ntfy error:", e)
          else:
              print("No significant move or new catalyst; skipping alert.")

          new_state = {
              "last_run_utc": now_str,
              "prices": current_prices,
              "last_alert_moves": significant_moves,
              "active_x_feeds": sorted(set(active_x_sources)),
              "seen_news": seen_ids,
          }
          with open(state_file, "w", encoding="utf-8") as f:
              json.dump(new_state, f, indent=2, ensure_ascii=False)
          EOF

      - name: Commit updated state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/
          if ! git diff --staged --quiet; then
            git commit -m "Update state [skip ci]"
            git push
          else
            echo "No state changes to commit."
          fi
