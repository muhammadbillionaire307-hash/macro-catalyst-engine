def cyr_ratio(s: str) -> float:
    c, l = len(CYR.findall(s)), len(re.findall(r"[A-Za-z]", s))
    return c / max(1, c + l)


def english_leftovers(s: str) -> list:
    return [w for w in LAT_WORD.findall(s) if w not in ALLOWED_LATIN]


def _tidy(t: str) -> str:
    t = re.sub(r"\s+([,.;:!?])", r"\1", t)
    t = re.sub(r",\s*,+", ", ", t)
    t = re.sub(r"\s+", " ", t).strip(" ,;-—")
    return (t[0].upper() + t[1:]) if t else t


def rule_translate(text: str) -> str:
    t = re.sub(r"\s*[-—|]\s*(Investing\.com|Reuters|Bloomberg)\b.*$", "", text, flags=re.I)
    t = re.sub(r"\b(\w+)['’]s\b", r"\1", t)
    for rx, t_tj in PROTECT_C:
        t = rx.sub(t_tj, t)
    for rx, repl in PATTERNS_C:
        if rx.search(t):
            t = rx.sub(repl, t, count=1)
            break
    for rx, t_tj in WORDS_C:
        t = rx.sub(t_tj, t)
    return _tidy(t)


def _protect(text: str):
    mp, t = {}, re.sub(r"\b(\w+)['’]s\b", r"\1", text)
    for rx, t_tj in PROTECT_C:
        def sub(m, t_tj=t_tj):
            k = f"XQ{len(mp)}X"
            mp[k] = t_tj
            return k
        t = rx.sub(sub, t)
    return t, mp


def _gtx(text: str, timeout=15) -> str:
    url = "https://translate.googleapis.com/translate_a/single?" + urllib.parse.urlencode(
        {"client": "gtx", "sl": "en", "tl": "tg", "dt": "t", "q": text}
    )
    req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})
    with urllib.request.urlopen(req, timeout=timeout) as r:
        data = json.loads(r.read().decode("utf-8"))
    return "".join(seg[0] for seg in data[0] if seg and seg[0])


def mt_translate(text: str) -> str:
    t, mp = _protect(text)
    out = _gtx(t)
    for k, v in mp.items():
        if k not in out:
            raise ValueError("placeholder lost")
        out = out.replace(k, v)
    for a, b in POSTFIX:
        out = out.replace(a, b)
    if cyr_ratio(out) < 0.6:
        raise ValueError("not tajik")
    return _tidy(out)


GEM_URL = "https://generativelanguage.googleapis.com/v1beta/models/{m}:generateContent?key={k}"


def gemini_batch(texts: list, key: str, model="gemini-2.0-flash") -> list:
    gloss = (
        "Fed=ФРС; Powell=Пауэлл; Trump=Трамп; DXY=индекси доллар (DXY); "
        "CPI=индекси нархҳои истеъмолӣ (CPI); NFP=омори шуғл (NFP); "
        "Treasury yields=даромадии вомбаргҳои хазинавӣ; OPEC=ОПЕК; tariffs=тарифҳо; sanctions=таҳримҳо"
    )
    prompt = (
        "Ту тарҷумони касбии хабарҳои молиявӣ ҳастӣ. Ҳар сарлавҳаи англисиро ба тоҷикии адабии равон "
        "(хати кириллӣ) тарҷума кун: мантиқӣ, бе тарҷумаи ҳарф ба ҳарф, бо тартиби дурусти ҷумла. "
        "Рақамҳо, фоизҳо ва тикерҳоро нагардон. Ҳеҷ калимаи англисии нолозим намонад. "
        f"Луғат: {gloss}. Фақат массиви JSON-и сатрҳо бо ҳамон теъдод бидеҳ.\n"
        + json.dumps(texts, ensure_ascii=False)
    )
    body = json.dumps(
        {
            "contents": [{"parts": [{"text": prompt}]}],
            "generationConfig": {"temperature": 0.2, "responseMimeType": "application/json"},
        }
    ).encode()
    req = urllib.request.Request(GEM_URL.format(m=model, k=key), body, {"Content-Type": "application/json"})
    with urllib.request.urlopen(req, timeout=30) as r:
        data = json.load(r)
    out = json.loads(data["candidates"][0]["content"]["parts"][0]["text"])
    if not isinstance(out, list) or len(out) != len(texts) or not all(isinstance(x, str) and x for x in out):
        raise ValueError("bad gemini schema")
    return [_tidy(x) for x in out]


class Translator:
    def __init__(self, gemini_key: str | None = None, log=print):
        self.key, self.log, self.engines = gemini_key, log, set()

    def translate_many(self, texts: list) -> list:
        res = [None] * len(texts)
        if self.key and texts:
            try:
                g = gemini_batch(texts, self.key)
                for i, x in enumerate(g):
                    if cyr_ratio(x) >= 0.6:
                        res[i] = x
                        self.engines.add("Gemini")
            except Exception as e:
                self.log(f"gemini translate failed: {e}")
        for i, t in enumerate(texts):
            if res[i] is not None:
                continue
            try:
                res[i] = mt_translate(t)
                self.engines.add("Google MT")
            except Exception as e:
                self.log(f"mt failed: {e}")
                r = rule_translate(t)
                left = english_leftovers(r)
                res[i] = r + (" ⚠(қисман)" if left else "")
                self.engines.add("қоидавӣ ⚠")
        return res

    def label(self) -> str:
        return " + ".join(sorted(self.engines)) or "—"


